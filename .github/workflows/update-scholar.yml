name: Update Google Scholar feed

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-scholar.yml"
      - "scripts/fetch_scholar.py"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scholar-feed
  cancel-in-progress: false

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch publications from Google Scholar via SerpAPI
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          python scripts/fetch_scholar.py

      - name: Commit and push updated publications.json
        run: |
          if git diff --quiet publications.json; then
            echo "No changes to publications.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publications.json
          git commit -m "chore: update publications.json from Google Scholar"
          # Preserve concurrent edits to other files on main.
          git pull --rebase origin main
          git push

  deploy:
    needs: update-scholar
    uses: ./.github/workflows/static.yml

